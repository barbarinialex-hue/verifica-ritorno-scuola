{% extends 'base.html' %}
{% block title %}Accedi · Verifica Ritorno Scuola{% endblock %}
{% block content %}<section class="narrow-content"><p class="eyebrow">Area personale</p><h1 class="page-title">Accedi</h1><p class="lead-copy">Entra per inviare e seguire le segnalazioni.</p><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Accedi</button><p class="mt-3 mb-0 muted-copy">Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a></p></form></section>{% endblock %}
