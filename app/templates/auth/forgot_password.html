{% extends 'base.html' %}
{% block title %}Recupera password · Verifica Ritorno Scuola{% endblock %}
{% block content %}<section class="narrow-content"><p class="eyebrow">Area personale</p><h1 class="page-title">Recupera la password</h1><p class="lead-copy">Inserisci l’email del tuo account. Se è registrata, riceverai un link valido per 30 minuti.</p><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-4"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div><button class="btn btn-primary" type="submit">Invia il link</button><p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Torna all’accesso</a></p></form></section>{% endblock %}
