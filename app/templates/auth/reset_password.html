{% extends 'base.html' %}
{% block title %}Scegli una nuova password · Verifica Ritorno Scuola{% endblock %}
{% block content %}<section class="narrow-content"><p class="eyebrow">Area personale</p><h1 class="page-title">Scegli una nuova password</h1><p class="lead-copy">Il link scade dopo 30 minuti. La nuova password deve avere almeno 10 caratteri.</p><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="password">Nuova password</label><input class="form-control" id="password" name="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="mb-4"><label class="form-label" for="conferma-password">Conferma password</label><input class="form-control" id="conferma-password" name="conferma_password" type="password" minlength="10" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Aggiorna password</button></form></section>{% endblock %}
