version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: verifica_ritorno_scuola_db
    environment:
      POSTGRES_DB: vrscuola
      POSTGRES_USER: vrscuola
      POSTGRES_PASSWORD: vrscuola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrscuola -d vrscuola"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
