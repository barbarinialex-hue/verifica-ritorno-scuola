services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--bind-address=0.0.0.0"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-0}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-16777216}
      UPLOAD_FOLDER: /app/instance/uploads
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
    command: sh -c "flask --app run.py db upgrade && flask --app run.py seed-data && gunicorn --workers 2 --bind 0.0.0.0:8000 run:app"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/app/instance/uploads

volumes:
  mysql_data:
  uploads:
